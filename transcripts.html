<main class="page"><div class="wrap">
<div class="page-head">
  <span class="eyebrow">原始素材</span>
  <h1>逐字稿库</h1>
  <p>社群课程的完整逐字稿。持续更新。</p>
</div>
<div id="transcriptApp">
  <div id="listView">
    <div class="toolbar">
      <input type="text" id="search" placeholder="搜索标题或日期…">
      <div class="filters" id="filters">
        <button class="fbtn on" data-k="all">全部</button>
        <button class="fbtn" data-k="晚间AMA">晚间 AMA</button>
        <button class="fbtn" data-k="晨间">晨间</button>
        <button class="fbtn" data-k="夜聊">夜聊</button>
        <button class="fbtn" data-k="午课">午课</button>
      </div>
    </div>
    <div id="tbody" class="tlist"></div>
    <div id="tempty" class="empty" style="display:none">没有找到匹配的逐字稿。</div>
  </div>
  <div id="readView" class="reader">
    <div class="reader-bar">
      <button class="rback" id="rBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>返回列表</button>
      <span class="r-title" id="rTitle"></span>
      <span class="r-meta" id="rMeta"></span>
    </div>
    <div class="content">
      <div class="warn"><div class="warn-title">机器识别初稿</div>
      <p>关键词可能有误（如「阿奇」被识为「阿起」）。引用前请对照正确说法。时间戳为视频时间。</p></div>
      <div class="transcript" id="rBody"></div>
    </div>
  </div>
</div>
</div></main>
<footer class="site-footer"><div class="wrap">
<p>ARK 学习指南 · 逐字稿库</p>
<p>逐字稿存放于 ark-transcripts 仓库，网站直接读取。</p>
</div></footer>
